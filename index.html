<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Arah Kiblat Profesional</title>
  <link rel="stylesheet" href="https://unpkg.com/leaflet/dist/leaflet.css"/>
  <style>
    body { font-family: 'Inter', sans-serif; margin:0; padding:0; background:#f3f6fb; color:#111827; }
    header { background:#0a3d62; color:white; padding:20px; text-align:center; }
    header h1 { margin:0; font-size:1.8rem; }
    #map { height: 400px; margin:15px; border-radius:12px; }
    #arrow { font-size:100px; transition: transform 0.3s ease; margin:20px auto; display:block; }
    #info { text-align:center; font-size:1.1rem; margin:10px; }
    .degree { font-weight:700; font-size:1.4rem; color:#0a3d62; }
    .error { color:red; }
    footer { text-align:center; font-size:0.9rem; color:#6b7280; padding:10px; }
  </style>
</head>
<body>

  <header>
    <h1>Arah Kiblat Profesional</h1>
    <p>GPS + Kompas + Peta → Hasil akurat</p>
  </header>

  <div id="map"></div>
  <div id="arrow">🧭</div>
  <div id="info">Menunggu lokasi...</div>

  <footer>© 2025 - Arah Kiblat Akurat & Profesional</footer>

  <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
  <script>
    const kaaba = [21.4225, 39.8262]; // Ka'bah
    let kiblatAzimuth = null;
    let map, userMarker, line;

    // Konversi derajat ke arah mata angin
    function getCompassDirection(angle) {
      const directions = ["Utara","Timur Laut","Timur","Tenggara","Selatan","Barat Daya","Barat","Barat Laut"];
      return directions[Math.round(angle/45)%8];
    }

    function hitungArah(lat, lng){
      let userLat = lat * Math.PI / 180;
      let userLng = lng * Math.PI / 180;
      let kaabaLat = kaaba[0] * Math.PI / 180;
      let kaabaLng = kaaba[1] * Math.PI / 180;
      let dLng = kaabaLng - userLng;
      let y = Math.sin(dLng);
      let x = Math.cos(userLat)*Math.tan(kaabaLat)-Math.sin(userLat)*Math.cos(dLng);
      let azimuth = Math.atan2(y, x) * 180 / Math.PI;
      if(azimuth<0) azimuth+=360;
      return azimuth;
    }

    function tampilMap(lat, lng){
      map = L.map('map').setView([lat, lng], 13);
      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution:'© OpenStreetMap' }).addTo(map);
      userMarker = L.marker([lat,lng]).addTo(map).bindPopup("Lokasi Anda").openPopup();
      L.marker(kaaba).addTo(map).bindPopup("Ka'bah");
      line = L.polyline([[lat,lng],kaaba],{color:'red',weight:3,dashArray:'5,10'}).addTo(map);
    }

    if(navigator.geolocation){
      navigator.geolocation.getCurrentPosition(pos=>{
        let lat = pos.coords.latitude;
        let lng = pos.coords.longitude;
        kiblatAzimuth = hitungArah(lat,lng);

        document.getElementById("info").innerHTML =
          `Lokasi: ${lat.toFixed(5)}, ${lng.toFixed(5)}<br>`+
          `Arah Kiblat: <span class="degree">${kiblatAzimuth.toFixed(2)}°</span> (${getCompassDirection(kiblatAzimuth)})`;

        tampilMap(lat,lng);
      },err=>{
        document.getElementById("info").innerHTML = `<span class="error">Gagal ambil lokasi: ${err.message}</span>`;
      });
    }else{
      document.getElementById("info").innerHTML="<span class='error'>Browser tidak mendukung GPS</span>";
    }

    // Sensor kompas
    if(window.DeviceOrientationEvent){
      window.addEventListener("deviceorientationabsolute", event=>{
        if(kiblatAzimuth!==null){
          let heading = event.alpha;
          if(typeof event.webkitCompassHeading!=="undefined") heading=event.webkitCompassHeading;
          let angle = kiblatAzimuth - heading;
          document.getElementById("arrow").style.transform=`rotate(${angle}deg)`;
        }
      },true);
    }
  </script>

</body>
</html>
